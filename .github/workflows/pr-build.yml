name: pr-build

# PR gate for libzigc migration PRs. Runs aarch64-native build + libc-test
# on the self-hosted Azure VM runner so feedback is fast (~5-15 min vs
# ~30-90 min for the full GitHub-hosted QEMU matrix). The full multi-target
# matrix runs post-merge on libc/0.16.x via post-merge-libc.yml.
#
# Jobs:
#   - pr-build: ast-check + migration claims + Build stage4.
#   - pr-libc-test: runs libc-test on the stage4 produced by pr-build.
#     api, math and the curated functional/regression subsets
#     (.github/libc-test-subsets/) are all required. Tests outside those
#     subsets (pthread/sem/tls/raise-race/iconv/spawn/popen/vfork) are still
#     excluded while the underlying libzigc migrations are in flight.
#   - pr-cross-compile: cross-compiles a tiny hello.c against libzigc + musl
#     libc.a for every target in the post-merge QEMU matrix. Catches
#     arch-specific libzigc compile errors (missing syscall fields,
#     unsupported ABI prongs, signed/unsigned mismatches) in seconds without
#     paying for QEMU. Known-broken targets are allowed to fail temporarily.
#   - ci-required (REQUIRED via branch protection): aggregate gate that fails
#     unless all required jobs pass.
#
# Trust model: this workflow runs PR-controlled code on a persistent
# self-hosted runner. The `if:` guard on the build job restricts execution
# to PRs whose head is the canonical repo or the trusted cataggar fork
# (the libzigc bot fork). Untrusted forks skip the self-hosted jobs and fail
# the aggregate ci-required gate until a maintainer moves the change onto a
# trusted branch.
on:
  pull_request:
    branches:
      - libc/0.16.x
      - libc/**

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  # Zig's official minisign public key, used by `ghr install` to verify the
  # `zig-aarch64-linux-*.tar.xz.minisig` sidecar on every download.
  ZIG_MINISIGN_PUBKEY: "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"
  LLVM_VERSION: "21.1.8"
  TARGET: aarch64-linux-musl
  MCPU: baseline
  CACHE_ROOT: /runner/_cache/pr-build
  # Per-workspace Zig caches so concurrent pr-build jobs on the same
  # self-hosted runner host can't clobber each other's `~/.cache/zig/`.
  # `${GITHUB_WORKSPACE}` is unique per runner work-slot (e.g.
  # `/runner/runner-3/_work/zig/zig`), so two jobs running on different
  # runner slots get fully isolated caches.
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

jobs:
  trust-check:
    name: pr-build trust check
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
    steps:
      - id: gate
        env:
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          BASE: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "head: $HEAD"
          echo "base: $BASE"
          case "$HEAD" in
              ctaggart/zig|cataggar/zig)
                  echo "trusted=true" >> "$GITHUB_OUTPUT"
                  ;;
              *)
                  if [ "$HEAD" = "$BASE" ]; then
                      echo "trusted=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "trusted=false" >> "$GITHUB_OUTPUT"
                      echo "::warning::Untrusted PR head '$HEAD'; skipping aarch64-native build."
                  fi
                  ;;
          esac

  build:
    name: pr-build
    needs: trust-check
    if: needs.trust-check.outputs.trusted == 'true'
    runs-on: [self-hosted, Linux, ARM64, nvme]
    timeout-minutes: 60
    outputs:
      stage4_key: ${{ steps.stage4key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare cache root
        run: mkdir -p "$CACHE_ROOT"

      - name: Setup release Zig (aarch64) + LLVM prefix (cached, atomic)
        run: |
          set -euo pipefail
          # `ghr` (cataggar/ghr — `pipx install ghr-bin`) is provided by the
          # self-hosted runner image and installs the release Zig with
          # built-in minisign + sha256 verification.
          if ! command -v ghr >/dev/null; then
              echo "ERROR: 'ghr' not found on PATH. Install with 'pipx install ghr-bin'." >&2
              exit 1
          fi

          # ---- Zig: ghr handles caching, verification, and PATH ----
          ghr install "ctaggart/zig@v${ZIG_VERSION}" "$ZIG_MINISIGN_PUBKEY"
          ghr_bin="$(ghr path bin)"
          "$ghr_bin/zig" version
          echo "$ghr_bin" >> "$GITHUB_PATH"

          # ---- LLVM prefix: cached extract under CACHE_ROOT, atomic publish ----
          llvm_top="llvm-zig-${LLVM_VERSION}-aarch64-linux"
          llvm_final="$CACHE_ROOT/$llvm_top"
          llvm_marker="$llvm_final/.complete"
          if [ ! -f "$llvm_marker" ]; then
              staging="$(mktemp -d -p "$CACHE_ROOT" .stage-XXXXXX)"
              # ghr download writes the archive to cwd, so stage in $staging.
              ( cd "$staging" && ghr download \
                  "ctaggart/llvm-project/${llvm_top}.tar.xz@llvmorg-${LLVM_VERSION}" \
                  --extract "$staging" )
              if [ ! -d "$staging/$llvm_top" ]; then
                  echo "ERROR: LLVM tarball did not contain expected top-level dir '$llvm_top'" >&2
                  ls -la "$staging" >&2
                  rm -rf "$staging"
                  exit 1
              fi
              # Atomic publish.
              rm -rf "$llvm_final"
              mv "$staging/$llvm_top" "$llvm_final"
              rm -rf "$staging"
              touch "$llvm_marker"
          fi
          echo "LLVM_PREFIX=$llvm_final" >> "$GITHUB_ENV"

      - name: zig version
        run: zig version

      - name: zig fmt --ast-check on changed lib/c files
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=AM \
              "origin/${{ github.base_ref }}...HEAD" -- 'lib/c/**.zig' || true)
          if [ -z "$changed" ]; then
              echo "No changed lib/c/**.zig files; skipping ast-check."
              exit 0
          fi
          echo "Running zig fmt --ast-check on:"
          printf '  %s\n' $changed
          zig fmt --ast-check $changed

      - name: check_musl_migration.py
        run: |
          set -euo pipefail
          if [ -f scripts/check_musl_migration.py ]; then
              python3 scripts/check_musl_migration.py
          else
              echo "scripts/check_musl_migration.py not present; skipping."
          fi

      - name: Compute stage4 cache key
        id: stage4key
        run: |
          set -euo pipefail
          # Hash everything that affects the stage4 build:
          #   - compiler sources (src/)
          #   - bundled libzigc / std (lib/) — gets statically linked into
          #     stage4 itself, so changes here must bust the cache
          #   - build script + manifest (build.zig, build.zig.zon)
          #   - CMake driver + helpers (CMakeLists.txt, cmake/**)
          # Plus runner/arch + tool versions + target/mcpu in the key prefix
          # so changes to any of those bust the cache.
          src_hash=$(find src lib build.zig build.zig.zon CMakeLists.txt cmake \
                  -type f -print0 2>/dev/null | sort -z \
                  | xargs -0 sha256sum 2>/dev/null \
                  | sha256sum | cut -d' ' -f1 | head -c 16)
          key="${{ runner.os }}-${{ runner.arch }}-zig${ZIG_VERSION}-llvm${LLVM_VERSION}-${TARGET}-${MCPU}-${src_hash}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "stage4 cache key: $key"

      - name: Build stage4 zig (key=${{ steps.stage4key.outputs.key }})
        run: |
          set -euo pipefail
          STAGE4="$CACHE_ROOT/stage4-${{ steps.stage4key.outputs.key }}"
          marker="$STAGE4/.complete"
          if [ -f "$marker" ] && [ -x "$STAGE4/bin/zig" ] && \
             "$STAGE4/bin/zig" version >/dev/null 2>&1; then
              echo "stage4 cache hit: $STAGE4"
          else
              echo "stage4 cache miss; building..."
              # Build into a staging dir and atomically move on success so
              # cancelled builds never leave a half-installed cache entry.
              staging="$(mktemp -d -p "$CACHE_ROOT" .stage4-XXXXXX)"
              export CC="zig cc -target ${TARGET} -mcpu=${MCPU}"
              export CXX="zig c++ -target ${TARGET} -mcpu=${MCPU}"
              cmake -S . -B build -G Ninja \
                  -DCMAKE_INSTALL_PREFIX="$staging" \
                  -DCMAKE_PREFIX_PATH="$LLVM_PREFIX" \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DZIG_TARGET_TRIPLE="${TARGET}" \
                  -DZIG_TARGET_MCPU="${MCPU}" \
                  -DZIG_STATIC=ON \
                  -DZIG_NO_LIB=ON \
                  -DCMAKE_C_LINKER_DEPFILE_SUPPORTED=FALSE \
                  -DCMAKE_CXX_LINKER_DEPFILE_SUPPORTED=FALSE
              unset CC CXX
              ninja -C build install
              "$staging/bin/zig" version
              rm -rf build
              # Publish atomically.
              rm -rf "$STAGE4"
              mv "$staging" "$STAGE4"
              touch "$marker"
              echo "stage4 published to $STAGE4"
          fi
          echo "STAGE4=$STAGE4" >> "$GITHUB_ENV"

      - name: Prune old stage4 caches (keep 24 most recent)
        if: always()
        run: |
          set -euo pipefail
          cd "$CACHE_ROOT"
          # Keep enough caches that downstream jobs (pr-libc-test,
          # pr-cross-compile) of older in-flight PRs can still find
          # their stage4 even after several newer pr-build jobs
          # have completed and pruned. Each stage4 is ~150MB; 24
          # entries fit comfortably on the runner's NVMe.
          ls -1dt stage4-* 2>/dev/null | tail -n +25 | xargs -r rm -rf || true
          echo "stage4 caches retained:"
          ls -1dt stage4-* 2>/dev/null || true

  libc-test:
    name: pr-libc-test
    needs: [trust-check, build]
    if: needs.trust-check.outputs.trusted == 'true'
    runs-on: [self-hosted, Linux, ARM64, nvme]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare cache root
        run: mkdir -p "$CACHE_ROOT"

      - name: Reclaim space from stale /tmp/zig-core-* dumps
        # The runner's /proc/sys/kernel/core_pattern is `/tmp/zig-core-%p`, and
        # /tmp is a 32G tmpfs (RAM-backed). Crashed processes (including from
        # other runners or past runs) leak core dumps there which can fill
        # tmpfs and break subsequent jobs with "No space left on device".
        # Clean owned dumps and report disk state for forensics.
        run: |
          set -euo pipefail
          before=$(df --output=avail /tmp | tail -1)
          find /tmp -maxdepth 1 -type f -name 'zig-core-*' -user "$(id -un)" -delete 2>/dev/null || true
          after=$(df --output=avail /tmp | tail -1)
          echo "/tmp avail KB: before=$before, after=$after"
          df -h /tmp

      - name: Setup release Zig (aarch64) + LLVM prefix (cached, atomic)
        run: |
          set -euo pipefail
          if ! command -v ghr >/dev/null; then
              echo "ERROR: 'ghr' not found on PATH. Install with 'pipx install ghr-bin'." >&2
              exit 1
          fi

          ghr install "ctaggart/zig@v${ZIG_VERSION}" "$ZIG_MINISIGN_PUBKEY"
          ghr_bin="$(ghr path bin)"
          "$ghr_bin/zig" version
          echo "$ghr_bin" >> "$GITHUB_PATH"

          llvm_top="llvm-zig-${LLVM_VERSION}-aarch64-linux"
          llvm_final="$CACHE_ROOT/$llvm_top"
          llvm_marker="$llvm_final/.complete"
          if [ ! -f "$llvm_marker" ]; then
              staging="$(mktemp -d -p "$CACHE_ROOT" .stage-XXXXXX)"
              ( cd "$staging" && ghr download \
                  "ctaggart/llvm-project/${llvm_top}.tar.xz@llvmorg-${LLVM_VERSION}" \
                  --extract "$staging" )
              if [ ! -d "$staging/$llvm_top" ]; then
                  echo "ERROR: LLVM tarball did not contain expected top-level dir '$llvm_top'" >&2
                  ls -la "$staging" >&2
                  rm -rf "$staging"
                  exit 1
              fi
              rm -rf "$llvm_final"
              mv "$staging/$llvm_top" "$llvm_final"
              rm -rf "$staging"
              touch "$llvm_marker"
          fi
          echo "LLVM_PREFIX=$llvm_final" >> "$GITHUB_ENV"

      - name: Locate stage4 from build job (key=${{ needs.build.outputs.stage4_key }})
        run: |
          set -euo pipefail
          STAGE4="$CACHE_ROOT/stage4-${{ needs.build.outputs.stage4_key }}"
          if [ ! -x "$STAGE4/bin/zig" ]; then
              echo "ERROR: stage4 not found at $STAGE4 (build job should have produced it)" >&2
              exit 1
          fi
          "$STAGE4/bin/zig" version
          # Bump mtime so concurrent pr-build prune steps (which sort
          # by mtime) treat this stage4 as recently-used and don't
          # evict it while this job is still running.
          touch "$STAGE4" || true
          echo "STAGE4=$STAGE4" >> "$GITHUB_ENV"

      - name: Update libc-test checkout (log SHA for forensics)
        run: |
          set -euo pipefail
          if [ ! -d "$CACHE_ROOT/libc-test/.git" ]; then
              git clone --depth 1 https://github.com/ctaggart/libc-test.git \
                  "$CACHE_ROOT/libc-test"
          else
              git -C "$CACHE_ROOT/libc-test" fetch --quiet --depth 1 origin master
              git -C "$CACHE_ROOT/libc-test" reset --hard --quiet origin/master
          fi
          libc_test_sha=$(git -C "$CACHE_ROOT/libc-test" rev-parse HEAD)
          echo "libc-test commit: $libc_test_sha"
          echo "LIBC_TEST_SHA=$libc_test_sha" >> "$GITHUB_ENV"

      - name: Run libc-test — functional subset (aarch64-linux-musl, native)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ "$(ulimit -u)" -lt 32768 ]; then ulimit -u 32768 2>/dev/null || true; fi
          if [ "$(ulimit -n)" -lt 32768 ]; then ulimit -n 32768 2>/dev/null || true; fi
          ulimit -c 0 2>/dev/null || true
          # Curated subset filters live in .github/libc-test-subsets/functional.txt
          # so pr-build and post-merge-libc share one source of truth.
          args=()
          while IFS= read -r f; do
            case "$f" in ''|\#*) continue;; esac
            args+=("-Dtest-filter=$f")
          done < .github/libc-test-subsets/functional.txt
          "$STAGE4/bin/zig" build test-libc \
              --zig-lib-dir lib \
              -Dlibc-test-path="$CACHE_ROOT/libc-test" \
              -Dtest-target-filter="${TARGET}" \
              "${args[@]}" \
              -j2 \
              --summary failures

      - name: Run libc-test — api (aarch64-linux-musl, native)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          if [ "$(ulimit -u)" -lt 32768 ]; then ulimit -u 32768 2>/dev/null || true; fi
          if [ "$(ulimit -n)" -lt 32768 ]; then ulimit -n 32768 2>/dev/null || true; fi
          ulimit -c 0 2>/dev/null || true
          "$STAGE4/bin/zig" build test-libc \
              --zig-lib-dir lib \
              -Dlibc-test-path="$CACHE_ROOT/libc-test" \
              -Dtest-target-filter="${TARGET}" \
              -Dtest-filter="api" \
              -j2 \
              --summary failures

      - name: Run libc-test — math (aarch64-linux-musl, native)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ "$(ulimit -u)" -lt 32768 ]; then ulimit -u 32768 2>/dev/null || true; fi
          if [ "$(ulimit -n)" -lt 32768 ]; then ulimit -n 32768 2>/dev/null || true; fi
          ulimit -c 0 2>/dev/null || true
          "$STAGE4/bin/zig" build test-libc \
              --zig-lib-dir lib \
              -Dlibc-test-path="$CACHE_ROOT/libc-test" \
              -Dtest-target-filter="${TARGET}" \
              -Dtest-filter="math" \
              -j2 \
              --summary failures

      - name: Run libc-test — regression subset (aarch64-linux-musl, native)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if [ "$(ulimit -u)" -lt 32768 ]; then ulimit -u 32768 2>/dev/null || true; fi
          if [ "$(ulimit -n)" -lt 32768 ]; then ulimit -n 32768 2>/dev/null || true; fi
          ulimit -c 0 2>/dev/null || true
          # Curated subset filters live in .github/libc-test-subsets/regression.txt
          # so pr-build and post-merge-libc share one source of truth.
          args=()
          while IFS= read -r f; do
            case "$f" in ''|\#*) continue;; esac
            args+=("-Dtest-filter=$f")
          done < .github/libc-test-subsets/regression.txt
          "$STAGE4/bin/zig" build test-libc \
              --zig-lib-dir lib \
              -Dlibc-test-path="$CACHE_ROOT/libc-test" \
              -Dtest-target-filter="${TARGET}" \
              "${args[@]}" \
              -j2 \
              --summary failures

  cross-compile:
    # Cross-compile a tiny program against libzigc + musl libc.a for every
    # target in the post-merge QEMU matrix. This catches arch-specific
    # compile errors in libzigc / lib/std (e.g. missing `linux.O.SYNC` on
    # s390x, missing `linux.SYS.ppoll` on RiscV32, "unsupported ABI" in
    # `pthread_mutex_t`) in seconds without paying for a full QEMU run.
    # Targets marked allow_failure are known-broken and remain advisory.
    name: pr-cross-compile (${{ matrix.target }})
    needs: [trust-check, build]
    if: needs.trust-check.outputs.trusted == 'true'
    runs-on: [self-hosted, Linux, ARM64, nvme]
    timeout-minutes: 20
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86-linux-musl
            allow_failure: false
          - target: x86_64-linux-musl
            allow_failure: false
          - target: aarch64-linux-musl
            allow_failure: false
          - target: aarch64_be-linux-musl
            allow_failure: false
          - target: arm-linux-musleabi
            allow_failure: false
          - target: arm-linux-musleabihf
            allow_failure: false
          - target: armeb-linux-musleabi
            allow_failure: false
          - target: armeb-linux-musleabihf
            allow_failure: false
          - target: thumb-linux-musleabihf
            allow_failure: false
          - target: thumbeb-linux-musleabihf
            allow_failure: false
          - target: riscv32-linux-musl
            allow_failure: false
          - target: riscv64-linux-musl
            allow_failure: false
          - target: powerpc64-linux-musl
            allow_failure: false
          - target: powerpc64le-linux-musl
            allow_failure: false
          - target: s390x-linux-musl
            allow_failure: false
          - target: loongarch64-linux-musl
            allow_failure: false
          - target: loongarch64-linux-muslsf
            allow_failure: false
          - target: wasm32-wasi-musl
            allow_failure: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare cache root
        run: mkdir -p "$CACHE_ROOT"

      - name: Reclaim space from stale /tmp/zig-core-* dumps
        run: |
          set -euo pipefail
          before=$(df --output=avail /tmp | tail -1)
          find /tmp -maxdepth 1 -type f -name 'zig-core-*' -user "$(id -un)" -delete 2>/dev/null || true
          after=$(df --output=avail /tmp | tail -1)
          echo "/tmp avail KB: before=$before, after=$after"
          df -h /tmp

      - name: Locate stage4 from build job (key=${{ needs.build.outputs.stage4_key }})
        run: |
          set -euo pipefail
          STAGE4="$CACHE_ROOT/stage4-${{ needs.build.outputs.stage4_key }}"
          if [ ! -x "$STAGE4/bin/zig" ]; then
              echo "ERROR: stage4 not found at $STAGE4 (build job should have produced it)" >&2
              exit 1
          fi
          "$STAGE4/bin/zig" version
          # Bump mtime so concurrent pr-build prune steps (which sort
          # by mtime) treat this stage4 as recently-used and don't
          # evict it while this job is still running.
          touch "$STAGE4" || true
          echo "STAGE4=$STAGE4" >> "$GITHUB_ENV"

      - name: Cross-compile hello (${{ matrix.target }})
        run: |
          set -euo pipefail
          if [ "$(ulimit -u)" -lt 32768 ]; then ulimit -u 32768 2>/dev/null || true; fi
          if [ "$(ulimit -n)" -lt 32768 ]; then ulimit -n 32768 2>/dev/null || true; fi
          ulimit -c 0 2>/dev/null || true
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          # Tiny Zig program that calls into libc — forces sub-compilation of
          # musl libc.a + libzigc.a + crt for the target. We don't run the
          # binary; we only verify it links.
          cat > "$tmpdir/hello.zig" <<'EOF'
          const std = @import("std");
          extern fn puts(s: [*:0]const u8) c_int;
          pub fn main() void {
              _ = puts("hello");
          }
          EOF
          "$STAGE4/bin/zig" build-exe \
              --zig-lib-dir lib \
              -target ${{ matrix.target }} \
              -mcpu baseline \
              -lc \
              -femit-bin="$tmpdir/hello" \
              "$tmpdir/hello.zig"

  ci-required:
    name: ci-required
    needs: [trust-check, build, libc-test, cross-compile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs
        env:
          TRUST_RESULT: ${{ needs.trust-check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LIBC_TEST_RESULT: ${{ needs.libc-test.result }}
          CROSS_COMPILE_RESULT: ${{ needs.cross-compile.result }}
        run: |
          set -euo pipefail
          failed=0
          for check in \
            "pr-build trust check:$TRUST_RESULT" \
            "pr-build:$BUILD_RESULT" \
            "pr-libc-test:$LIBC_TEST_RESULT" \
            "pr-cross-compile required targets:$CROSS_COMPILE_RESULT"
          do
            name="${check%%:*}"
            result="${check#*:}"
            if [ "$result" = "success" ]; then
              echo "$name: $result"
            else
              echo "::error::$name ended with result '$result'"
              failed=1
            fi
          done
          exit "$failed"
